name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build & Publish Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment Verification ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"

          if [ -z "$JAVA_HOME" ]; then
            echo "ERROR: JAVA_HOME is not set." >&2
            exit 1
          fi

          RAW_VERSION=$(java -version 2>&1 | head -n 1)
          echo "Version string: $RAW_VERSION"

          JAVA_MAJOR=$(echo "$RAW_VERSION" | sed -E -n 's/.*version "([0-9]+).*/\1/p')

          if [ -z "$JAVA_MAJOR" ]; then
            echo "ERROR: Failed to detect the active Java major version." >&2
            exit 1
          fi

          echo "Detected Java major version: $JAVA_MAJOR"

          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "ERROR: Active Java version ($JAVA_MAJOR) is lower than the required version 17." >&2
            exit 1
          fi

          echo "Java environment successfully verified with Java $JAVA_MAJOR."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "Existing debug.keystore found."
          else
            echo "debug.keystore not found. Generating temporary debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000

            if [ ! -f "./debug.keystore" ]; then
              echo "ERROR: Failed to create ./debug.keystore" >&2
              exit 1
            fi
            echo "Temporary debug keystore created successfully."
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$EXPECTED_APK" ]; then
            echo "ERROR: Expected debug APK not found at $EXPECTED_APK" >&2
            echo "Searching only inside app/build/outputs/apk for discovered APKs:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            echo "Failing step because expected debug APK does not exist." >&2
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "ERROR: Verified APK file is empty: $EXPECTED_APK" >&2
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *)
              echo "ERROR: Target file does not have .apk extension: $EXPECTED_APK" >&2
              exit 1
              ;;
          esac

          if [ "$EXPECTED_APK" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "ERROR: APK path is not exactly app/build/outputs/apk/debug/app-debug.apk" >&2
            exit 1
          fi

          echo "APK successfully verified: $EXPECTED_APK (non-empty regular file)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_DIR="${RUNNER_TEMP:-/tmp}/release-apk-asset"
          mkdir -p "$TEMP_DIR"

          RAW_REPO_NAME=$(basename "${{ github.repository }}")
          CLEAN_REPO_NAME=$(echo "$RAW_REPO_NAME" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9_-' '-' | sed 's/^-//;s/-$//')
          if [ -z "$CLEAN_REPO_NAME" ]; then
            CLEAN_REPO_NAME="android-app"
          fi

          ASSET_FILENAME="${CLEAN_REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          ASSET_PATH="${TEMP_DIR}/${ASSET_FILENAME}"

          cp "app/build/outputs/apk/debug/app-debug.apk" "$ASSET_PATH"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Failed to prepare APK release asset at $ASSET_PATH" >&2
            exit 1
          fi

          echo "Prepared release asset: $ASSET_PATH"
          echo "asset_path=$ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking GitHub CLI availability..."
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Release asset does not exist or is empty: $ASSET_PATH" >&2
            exit 1
          fi

          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "ERROR: Release asset is not an .apk file: $ASSET_PATH" >&2
              exit 1
              ;;
          esac

          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          TARGET_SHA="${{ github.sha }}"

          gh release create "$TAG_NAME" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --target "$TARGET_SHA" \
            --notes "### Automated Debug Build
          - **Type**: Automatically generated debug APK
          - **Builder**: Built by GitHub Actions
          - **Run Number**: ${{ github.run_number }}
          - **Run Attempt**: ${{ github.run_attempt }}
          - **Source Commit SHA**: ${{ github.sha }}
          - **Purpose**: Intended for testing and development
          - **Notice**: This is not a Play Store production release
          - **Signing**: Signed with a temporary debug keystore" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "GitHub Release published successfully."
            RELEASE_URL=$(gh release view "$TAG_NAME" --json url -q .url 2>/dev/null || echo "")

            echo "Release Tag: $TAG_NAME"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release Page URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"

            echo "### 🚀 APK Download Available" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The debug APK has been published to GitHub Releases:" >> "$GITHUB_STEP_SUMMARY"
            if [ -n "$RELEASE_URL" ]; then
              echo "- **Release Page**: [$TAG_NAME]($RELEASE_URL)" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- **Release Tag**: \`$TAG_NAME\`" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "- **Asset Filename**: \`$ASSET_NAME\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The APK file can be downloaded directly to your phone from the **Assets** section of the release page." >> "$GITHUB_STEP_SUMMARY"
            echo "The standard GitHub Actions artifact (\`app-debug-apk\`) is also preserved as a backup." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release creation did not complete successfully."
            echo "The debug APK was built successfully and is preserved as an Actions artifact."
            echo "Artifact Name: app-debug-apk"

            echo "### ⚠️ Debug APK Build Notice" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The debug APK build succeeded, but automatic GitHub Release publishing was not completed." >> "$GITHUB_STEP_SUMMARY"
            echo "The APK remains fully available for download under the workflow run **Artifacts** section as **\`app-debug-apk\`**." >> "$GITHUB_STEP_SUMMARY"
          fi
